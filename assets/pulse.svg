<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040712"/><stop offset=".52" stop-color="#0a1022"/><stop offset="1" stop-color="#111a37"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a35"/><stop offset="1" stop-color="#0a1027"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".06"/></pattern></defs><rect width="1400" height="560" rx="34" fill="url(#bg)"/><rect width="1400" height="560" rx="34" fill="url(#grid)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="58" y="58" fill="#64748b" font-size="14" letter-spacing="4">ENGINEERING SIGNAL · OPEN SOURCE</text><text x="58" y="100" fill="#fff" font-size="36" font-weight="800">Build → Learn → Ship</text><text x="58" y="130" fill="#94a3b8" font-size="15">A compact view of the work, experiments and systems behind this profile.</text><g fill="url(#card)" stroke="#26375f" stroke-width="1.5"><rect x="58" y="168" width="400" height="118" rx="24"/><rect x="500" y="168" width="400" height="118" rx="24"/><rect x="942" y="168" width="400" height="118" rx="24"/></g><g fill="#22d3ee"><circle cx="88" cy="202" r="6"/><circle cx="530" cy="202" r="6"/><circle cx="972" cy="202" r="6"/></g><g fill="#fff" font-size="18" font-weight="800"><text x="108" y="208">BUILDING</text><text x="550" y="208">DEEPENING</text><text x="992" y="208">SHIPPING</text></g><g fill="#a5b4fc" font-size="13"><text x="86" y="239">AgentMark · SafeRoute · AI systems</text><text x="528" y="239">RAG · Agents · Evals · Guardrails</text><text x="970" y="239">FastAPI · PostgreSQL · Docker</text><text x="86" y="263" fill="#64748b">systems with real architecture &amp; failure modes</text><text x="528" y="263" fill="#64748b">depth over buzzwords</text><text x="970" y="263" fill="#64748b">turning experiments into usable software</text></g><rect x="58" y="320" width="1284" height="168" rx="26" fill="#080f24" stroke="#26375f"/><text x="82" y="354" fill="#cbd5e1" font-size="13" font-weight="800" letter-spacing="2">OPEN-SOURCE PULSE</text><g fill="#0e1933" stroke="#26375f"><rect x="82" y="376" width="160" height="78" rx="18"/><rect x="258" y="376" width="160" height="78" rx="18"/><rect x="434" y="376" width="160" height="78" rx="18"/><rect x="610" y="376" width="160" height="78" rx="18"/><rect x="786" y="376" width="160" height="78" rx="18"/><rect x="962" y="376" width="356" height="78" rx="18"/></g><g fill="#fff" font-size="24" font-weight="800"><text x="162" y="411" text-anchor="middle">12</text><text x="338" y="411" text-anchor="middle">3</text><text x="514" y="411" text-anchor="middle">4</text><text x="690" y="411" text-anchor="middle">∞</text><text x="866" y="411" text-anchor="middle">AI</text></g><g fill="#94a3b8" font-size="11"><text x="162" y="434" text-anchor="middle">PUBLIC REPOS</text><text x="338" y="434" text-anchor="middle">FLAGSHIP SYSTEMS</text><text x="514" y="434" text-anchor="middle">AI LAYERS</text><text x="690" y="434" text-anchor="middle">LEARNING LOOP</text><text x="866" y="434" text-anchor="middle">PRIMARY FOCUS</text></g><text x="990" y="409" fill="#a5b4fc" font-size="13" font-weight="700">MODEL  ·  RETRIEVAL  ·  AGENTS  ·  RELIABILITY</text><text x="990" y="432" fill="#64748b" font-size="11">The signal I want recruiters to see: consistent building, deliberate depth, and shipped systems.</text><path d="M58 520H1342" stroke="url(#a)" stroke-width="2" opacity=".7" filter="url(#glow)"/><text x="700" y="544" text-anchor="middle" fill="#64748b" font-size="11">Not a vanity-metrics wall — a visual summary of engineering direction.</text></g></svg>