<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020307"/><stop offset=".52" stop-color="#050b18"/><stop offset="1" stop-color="#0a1022"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#4da3ff" stop-opacity=".32"/><stop offset=".42" stop-color="#245fff" stop-opacity=".11"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfe8ff" stop-opacity=".95"/><stop offset=".35" stop-color="#5d9eff" stop-opacity=".46"/><stop offset="1" stop-color="#6657ff" stop-opacity=".16"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#d5f1ff"/><stop offset=".5" stop-color="#4ca2ff"/><stop offset="1" stop-color="#8f7cff"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8dbbff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1600" height="720" rx="44" fill="url(#bg)"/>
<rect width="1600" height="720" rx="44" fill="url(#grid)"/>
<circle cx="1180" cy="360" r="360" fill="url(#halo)" filter="url(#blur)"/>

<g font-family="Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif">
  <text x="92" y="104" fill="#8da1bc" font-size="15" letter-spacing="5">AI / ML ENGINEER</text>
  <text x="92" y="220" fill="#f7fbff" font-size="82" font-weight="750" letter-spacing="-3">I engineer</text>
  <text x="92" y="310" fill="#f7fbff" font-size="82" font-weight="750" letter-spacing="-3">AI systems.</text>
  <rect x="94" y="350" width="76" height="4" rx="2" fill="#72bcff" filter="url(#glow)"/>
  <text x="94" y="405" fill="#b7c4d8" font-size="23">ML · GenAI · RAG · Agentic Systems</text>
  <text x="94" y="448" fill="#6f829d" font-size="17">From model quality to production reliability.</text>
  <text x="94" y="592" fill="#4f6179" font-size="14" letter-spacing="2">ABHISHEK KUMAR YADAV</text>
  <text x="94" y="618" fill="#314156" font-size="13">BUILDING · LEARNING · SHIPPING</text>
</g>

<!-- cinematic 3D glass core -->
<g transform="translate(1190 360)" filter="url(#glow)">
  <ellipse rx="260" ry="105" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity=".48"/>
  <ellipse rx="220" ry="82" fill="none" stroke="#7db7ff" stroke-width="1" opacity=".25" transform="rotate(-22)"/>
  <ellipse rx="275" ry="88" fill="none" stroke="#7f72ff" stroke-width="1" opacity=".18" transform="rotate(28)"/>
  <path d="M0 -146 L118 -62 L94 94 L0 158 L-112 82 L-122 -60 Z" fill="url(#glass)" opacity=".42" stroke="url(#edge)" stroke-width="2"/>
  <path d="M0 -146 L0 158 M-122 -60 L118 -62 M-112 82 L94 94" fill="none" stroke="#d8f1ff" stroke-opacity=".32"/>
  <circle r="76" fill="#0b1834" stroke="#86c6ff" stroke-opacity=".65" stroke-width="2"/>
  <circle r="52" fill="#0d2b5b" stroke="#9cdbff" stroke-opacity=".35"/>
  <circle r="20" fill="#d9f5ff"/>
  <circle cx="-160" cy="-74" r="5" fill="#a8deff"/><circle cx="172" cy="42" r="4" fill="#a997ff"/><circle cx="86" cy="-150" r="3" fill="#b8e4ff"/>
  <g opacity=".75"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/><circle cx="238" cy="0" r="4" fill="#d5edff"/></g>
</g>
</svg>